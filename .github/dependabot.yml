version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The current typescript-eslint integration rejects TypeScript 7.
    # Revisit after eslint-config-next supports the new compiler API.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      development-tooling:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
